name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  TERM: xterm
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get install -y zsh bats jq sqlite3
      - run: bats tests/dot.bats

  integration:
    runs-on: macos-latest

    concurrency:
      group: ${{ github.workflow }}-${{ matrix.command }}-${{ github.ref }}
      cancel-in-progress: true

    strategy:
      matrix:
        command:
          - help
          - init
          - install-brew
          - install-defaults
          - install-fisher
          - install-vim
          - link
          - update
          - version

    steps:
      - uses: actions/checkout@v7
        with:
          # PRs check out a detached merge ref; `dot update` needs a branch to pull
          ref: ${{ github.head_ref || github.ref_name }}

      - if: ${{ matrix.command == 'install-brew' && github.event_name == 'pull_request' }}
        id: brew
        name: Skip brew if its inputs are unchanged
        run: |
          git fetch --depth=1 origin ${{ github.event.pull_request.base.sha }}
          if git diff --quiet ${{ github.event.pull_request.base.sha }} HEAD -- Brewfile dot .github/workflows/ci.yml; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: ${{ matrix.command == 'install-brew' && steps.brew.outputs.skip != 'true' }}
        run: brew update

      - if: ${{ matrix.command == 'install-brew' && steps.brew.outputs.skip != 'true' }}
        name: Run brew uninstall go
        run: |
          versions=$(brew list | grep -E '^go$|^go@' || true)
          echo $versions

          for v in $versions
          do
            echo "brew uninstall $v"
            brew uninstall $v
          done

      - if: ${{ matrix.command == 'install-brew' && steps.brew.outputs.skip != 'true' }}
        name: Skip installs
        run: |
          # Container and Supacode both require MacOS 26 to install
          echo "HOMEBREW_BUNDLE_BREW_SKIP=container" >> "$GITHUB_ENV"
          echo "HOMEBREW_BUNDLE_CASK_SKIP=supacode" >> "$GITHUB_ENV"

          # MAS installs do not work in CI
          mas_ids=$(cat Brewfile | grep -oE "[0-9]{9,}" | tr '\n' ' ')
          echo $mas_ids
          echo "HOMEBREW_BUNDLE_MAS_SKIP=$mas_ids" >> "$GITHUB_ENV"

      - if: ${{ !(matrix.command == 'install-brew' && steps.brew.outputs.skip == 'true') }}
        run: ./dot ${{ matrix.command }}

      - if: ${{ matrix.command == 'init' }}
        name: Run dot from PATH
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          command -v dot
          dot version

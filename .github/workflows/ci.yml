name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  TERM: xterm
  HOMEBREW_NO_AUTO_UPDATE: "1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: sudo apt-get install -y zsh jq sqlite3
      - uses: hustcer/setup-nu@1b8faed9a8ff673c8ce0beae243e0b72d0787241 # v3.30
      - run: tests/run

  integration:
    runs-on: macos-latest

    concurrency:
      group: ${{ github.workflow }}-${{ matrix.command }}-${{ github.ref }}
      cancel-in-progress: true

    strategy:
      matrix:
        command:
          - help
          - init
          - install brew
          - install defaults
          - install fisher
          - install vim
          - link
          - merge
          - update
          - version

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PRs check out a detached merge ref; `dot update` needs a branch to pull
          ref: ${{ github.head_ref || github.ref_name }}

      - if: ${{ matrix.command == 'install brew' && github.event_name == 'pull_request' }}
        id: brew
        name: Skip brew if its inputs are unchanged
        run: |
          git fetch --depth=1 origin ${{ github.event.pull_request.base.sha }}
          if git diff --quiet ${{ github.event.pull_request.base.sha }} HEAD -- Brewfile dot .github/workflows/ci.yml; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: ${{ matrix.command == 'install brew' && steps.brew.outputs.skip != 'true' }}
        run: brew update

      - if: ${{ matrix.command == 'install brew' && steps.brew.outputs.skip != 'true' }}
        name: Run brew uninstall go
        run: |
          versions=$(brew list | grep -E '^go$|^go@' || true)
          echo $versions

          for v in $versions
          do
            echo "brew uninstall $v"
            brew uninstall $v
          done

      - if: ${{ matrix.command == 'install brew' && steps.brew.outputs.skip != 'true' }}
        name: Skip installs
        run: |
          # Container requires MacOS 26 to install
          echo "HOMEBREW_BUNDLE_BREW_SKIP=container" >> "$GITHUB_ENV"

          # MAS installs do not work in CI
          mas_ids=$(cat Brewfile | grep -oE "[0-9]{9,}" | tr '\n' ' ')
          echo $mas_ids
          echo "HOMEBREW_BUNDLE_MAS_SKIP=$mas_ids" >> "$GITHUB_ENV"

      - if: ${{ matrix.command == 'install fisher' || matrix.command == 'install vim' }}
        name: Run dot link
        run: ./dot link

      - if: ${{ !(matrix.command == 'install brew' && steps.brew.outputs.skip == 'true') }}
        run: ./dot ${{ matrix.command }}

      - if: ${{ matrix.command == 'init' }}
        name: Run dot from PATH
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          command -v dot
          dot version
